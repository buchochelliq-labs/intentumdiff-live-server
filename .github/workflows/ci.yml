name: CI

on:
  push:
    branches: ["main", "release/**", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: 1.95.0
      # Phase D: the git dep on the private intentumdiff-core needs an org token wired
      # (CARGO_NET_GIT_FETCH_WITH_CLI + a checkout credential) before this job can run.
      - name: Authenticate cross-repo git deps
        # Private sibling repos (the SDK / the engine) are git dependencies. GITHUB_TOKEN is
        # scoped to THIS repo only, so cargo/pip cannot fetch them without an org-scoped
        # token. Set the SPLIT_REPO_TOKEN secret (PAT or App token with read access to the
        # buchochelliq-labs repos); without it this step warns and the build fails clearly.
        env:
          SPLIT_REPO_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
        run: |
          if [ -n "$SPLIT_REPO_TOKEN" ]; then
            git config --global url."https://x-access-token:${SPLIT_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "cross-repo git auth configured"
          else
            echo "::warning::SPLIT_REPO_TOKEN not set - private cross-repo dependencies will fail to fetch"
          fi

      - name: Provision checksum-verified parser components
        env:
          GH_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
        run: python scripts/provision_components.py

      - name: Build + test
        run: |
          cargo build --locked --release
          cargo test --locked
          cargo test --locked --release
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          INTENTUMDIFF_TEST_WASM_DIR: ${{ github.workspace }}/dist/wasm

      - name: Verify native runtime and package tested binary
        run: |
          ldd target/release/intentumdiff-live-server > native-linkage.txt
          if grep -i libpython native-linkage.txt; then
            echo "Native runtime unexpectedly links Python" >&2
            exit 1
          fi
          python scripts/package_native.py
          cd artifacts
          sha256sum --check SHA256SUMS

      - name: Upload tested native runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-linux-x64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
