name: CI

on:
  push:
    branches: ["main", "release/**", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: 1.95.0
      # Phase D: the git dep on the private intentumdiff-core needs an org token wired
      # (CARGO_NET_GIT_FETCH_WITH_CLI + a checkout credential) before this job can run.
      - name: Authenticate cross-repo git deps
        # Private sibling repos (the SDK / the engine) are git dependencies. GITHUB_TOKEN is
        # scoped to THIS repo only, so cargo/pip cannot fetch them without an org-scoped
        # token. Set the SPLIT_REPO_TOKEN secret (PAT or App token with read access to the
        # buchochelliq-labs repos); without it this step warns and the build fails clearly.
        env:
          SPLIT_REPO_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
        run: |
          if [ -n "$SPLIT_REPO_TOKEN" ]; then
            git config --global url."https://x-access-token:${SPLIT_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "cross-repo git auth configured"
          else
            echo "::warning::SPLIT_REPO_TOKEN not set - private cross-repo dependencies will fail to fetch"
          fi

      - name: Provision checksum-verified parser components
        env:
          GH_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
        run: python scripts/provision_components.py

      # TEMPORARY RC lock-reconciliation gate: Cargo must resolve the exact new
      # Rust core and Wasmtime 48.0.7 graph. Publish the result for manual
      # review/commit, then remove these two steps and rerun --locked CI.
      - name: Resolve updated native dependency lock for inspection
        run: |
          set -euo pipefail
          cargo update --manifest-path Cargo.toml -p intentumdiff-rust-core
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          lock = tomllib.loads(Path("Cargo.lock").read_text())
          pkgs = lock["package"]
          for name in ("wasmtime", "wasmtime-wasi"):
              versions = [p["version"] for p in pkgs if p["name"] == name]
              assert versions == ["48.0.7"], (name, versions)
          assert not any(p["version"] == "47.0.3" and p["name"].startswith("wasmtime") for p in pkgs)
          matched = [p for p in pkgs if p["name"] == "intentumdiff-rust-core"]
          assert len(matched) == 1
          source = matched[0].get("source", "")
          assert "a7a954bb875d73c132b8d2df6ddb5e3cedddd7a2" in source, source
          PY
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      - name: Retain regenerated native lockfile for exact review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-core48-lock-candidate-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error

      # TEMPORARY: transfer the regenerated public lock bytes back into a
      # reviewed Git blob without granting a PR workflow repository write access.
      - name: Emit regenerated native lock base64 for exact file reconciliation
        run: |
          printf 'NATIVE_LOCK_BEGIN\n'
          sha256sum Cargo.lock
          base64 -w 120 Cargo.lock | sed 's/^/LOCK64:/'
          printf 'NATIVE_LOCK_END\n'

      - name: Build + test
        run: |
          cargo build --locked --release
          cargo test --locked
          cargo test --locked --release
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          INTENTUMDIFF_TEST_WASM_DIR: ${{ github.workspace }}/dist/wasm

      - name: Verify native runtime and package tested binary
        run: |
          ldd target/release/intentumdiff-live-server > native-linkage.txt
          if grep -i libpython native-linkage.txt; then
            echo "Native runtime unexpectedly links Python" >&2
            exit 1
          fi
          python scripts/package_native.py
          cd artifacts
          sha256sum --check SHA256SUMS

      - name: Upload tested native runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-linux-x64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
