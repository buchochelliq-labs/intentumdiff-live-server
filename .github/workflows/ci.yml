name: CI

on:
  push:
    branches: ["main", "release/**", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: 1.95.0
      # Phase D: the git dep on the private intentumdiff-core needs an org token wired
      # (CARGO_NET_GIT_FETCH_WITH_CLI + a checkout credential) before this job can run.
      - name: Authenticate cross-repo git deps
        # Private sibling repos (the SDK / the engine) are git dependencies. GITHUB_TOKEN is
        # scoped to THIS repo only, so cargo/pip cannot fetch them without an org-scoped
        # token. Set the SPLIT_REPO_TOKEN secret (PAT or App token with read access to the
        # buchochelliq-labs repos); without it this step warns and the build fails clearly.
        env:
          SPLIT_REPO_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
        run: |
          if [ -n "$SPLIT_REPO_TOKEN" ]; then
            git config --global url."https://x-access-token:${SPLIT_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "cross-repo git auth configured"
          else
            echo "::warning::SPLIT_REPO_TOKEN not set - private cross-repo dependencies will fail to fetch"
          fi

      - name: Verify parser bundle provenance guardrails
        run: python -m unittest discover -s scripts -p test_provision_components.py

      - name: Provision checksum-verified parser components
        env:
          GH_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
        run: python scripts/provision_components.py

      # RC release gate: use the audited dependency graph committed alongside
      # this workflow. No Cargo update on the runner: --locked must exercise
      # precisely these reviewed bytes, not a silently regenerated lock.
      - name: Verify immutable Core/Wasmtime 48 lock and manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import tomllib

          core = "d275e3311e7bbf8cac181064559cae8eb6d8f665"
          expected_lock_sha256 = "21b26f692b85f1e29561a7e1ed6c9f507794e28990c4609b3d8fe9224f0019ca"
          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          actual_rev = manifest["dependencies"]["intentumdiff-rust-core"]["rev"]
          assert actual_rev == core, f"unexpected Rust Core manifest revision: {actual_rev}"
          lock_bytes = Path("Cargo.lock").read_bytes()
          actual_hash = hashlib.sha256(lock_bytes).hexdigest()
          assert actual_hash == expected_lock_sha256, f"native lockfile changed: {actual_hash}"
          pkgs = tomllib.loads(lock_bytes.decode("utf-8"))["package"]
          owned_core = [p for p in pkgs if p["name"] == "intentumdiff-rust-core"]
          assert len(owned_core) == 1 and core in owned_core[0].get("source", ""), owned_core
          for name in ("wasmtime", "wasmtime-wasi"):
              versions = [p["version"] for p in pkgs if p["name"] == name]
              assert versions == ["48.0.7"], (name, versions)
          assert not any(
              p["name"].startswith("wasmtime") and p["version"] == "47.0.3"
              for p in pkgs
          ), "legacy vulnerable Wasmtime package retained"
          PY
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"

      - name: Build + test
        run: |
          cargo build --locked --release
          cargo test --locked
          cargo test --locked --release
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          INTENTUMDIFF_TEST_WASM_DIR: ${{ github.workspace }}/dist/wasm

      - name: Verify native runtime and package tested binary
        run: |
          ldd target/release/intentumdiff-live-server > native-linkage.txt
          if grep -i libpython native-linkage.txt; then
            echo "Native runtime unexpectedly links Python" >&2
            exit 1
          fi
          python scripts/package_native.py
          cd artifacts
          sha256sum --check SHA256SUMS

      - name: Upload tested native runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-linux-x64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
