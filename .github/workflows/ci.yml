name: CI

on:
  push:
    branches: ["main", "release/**", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Release gate: the audited dependency graph and the parser-wheel/native-core pairing are
  # platform independent, so they are verified once before any platform build.
  lock-gate:
    name: Lock + provenance gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: 1.95.0
      - name: Authenticate cross-repo git deps
        # Private sibling repos (the SDK / the engine) are git dependencies. GITHUB_TOKEN is
        # scoped to THIS repo only, so cargo/pip cannot fetch them without an org-scoped
        # token. Set the SPLIT_REPO_TOKEN secret (PAT or App token with read access to the
        # buchochelliq-labs repos); without it this step warns and the build fails clearly.
        env:
          SPLIT_REPO_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
        run: |
          if [ -n "$SPLIT_REPO_TOKEN" ]; then
            git config --global url."https://x-access-token:${SPLIT_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "cross-repo git auth configured"
          else
            echo "::warning::SPLIT_REPO_TOKEN not set - private cross-repo dependencies will fail to fetch"
          fi

      - name: Verify provisioning and packaging guardrails
        run: python -m unittest discover -s scripts -p 'test_*.py'

      # RC release gate: use the audited dependency graph committed alongside
      # this workflow. No Cargo update on the runner: --locked must exercise
      # precisely these reviewed bytes, not a silently regenerated lock.
      - name: Verify immutable Core/Wasmtime 48 lock and manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import tomllib
          from scripts.provision_components import require_matching_native_core

          core = "1c4bdbc5dfbe6e738b3d70d8964e7f148d711821"
          expected_lock_sha256 = "c78fab14b10ce1ec54e6ead3b4d13b67712e81afcccda7b37da51c3afbbf43e0"
          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          actual_rev = manifest["dependencies"]["intentumdiff-rust-core"]["rev"]
          assert actual_rev == core, f"unexpected Rust Core manifest revision: {actual_rev}"
          require_matching_native_core(actual_rev)
          lock_bytes = Path("Cargo.lock").read_bytes()
          actual_hash = hashlib.sha256(lock_bytes).hexdigest()
          assert actual_hash == expected_lock_sha256, f"native lockfile changed: {actual_hash}"
          pkgs = tomllib.loads(lock_bytes.decode("utf-8"))["package"]
          owned_core = [p for p in pkgs if p["name"] == "intentumdiff-rust-core"]
          assert len(owned_core) == 1 and core in owned_core[0].get("source", ""), owned_core
          for name in ("wasmtime", "wasmtime-wasi"):
              versions = [p["version"] for p in pkgs if p["name"] == name]
              assert versions == ["48.0.7"], (name, versions)
          assert not any(
              p["name"].startswith("wasmtime") and p["version"] == "47.0.3"
              for p in pkgs
          ), "legacy vulnerable Wasmtime package retained"
          PY
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"


  # One tested, checksummed native runtime per supported VS Code target (#25). Nothing is
  # published from here: each job uploads a CI artifact only.
  build-and-test:
    name: Build + tests (${{ matrix.platform }})
    needs: lock-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-latest }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: darwin-arm64, runner: macos-latest }
          - { platform: win32-x64, runner: windows-latest }
          - { platform: win32-arm64, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Python 3.13 (build-time archive utility only)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: 1.95.0
      - name: Authenticate cross-repo git deps
        # Private sibling repos (the SDK / the engine) are git dependencies. GITHUB_TOKEN is
        # scoped to THIS repo only, so cargo/pip cannot fetch them without an org-scoped
        # token. Set the SPLIT_REPO_TOKEN secret (PAT or App token with read access to the
        # buchochelliq-labs repos); without it this step warns and the build fails clearly.
        env:
          SPLIT_REPO_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
        run: |
          if [ -n "$SPLIT_REPO_TOKEN" ]; then
            git config --global url."https://x-access-token:${SPLIT_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "cross-repo git auth configured"
          else
            echo "::warning::SPLIT_REPO_TOKEN not set - private cross-repo dependencies will fail to fetch"
          fi

      - name: Provision checksum-verified parser components
        env:
          GH_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
        run: python scripts/provision_components.py

      - name: Build + test
        run: |
          cargo build --locked --release
          cargo test --locked
          cargo test --locked --release
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          INTENTUMDIFF_TEST_WASM_DIR: ${{ github.workspace }}/dist/wasm

      - name: Verify native runtime does not link Python
        run: |
          case "${{ matrix.platform }}" in
            linux-*) ldd target/release/intentumdiff-live-server > native-linkage.txt ;;
            darwin-*) otool -L target/release/intentumdiff-live-server > native-linkage.txt ;;
            win32-*) objdump -p target/release/intentumdiff-live-server.exe | grep -i "DLL Name" > native-linkage.txt || true ;;
          esac
          cat native-linkage.txt
          if grep -i python native-linkage.txt; then
            echo "Native runtime unexpectedly links Python" >&2
            exit 1
          fi

      - name: Package tested binary
        run: |
          python scripts/package_native.py --platform "${{ matrix.platform }}"
          python scripts/package_native.py --verify artifacts

      - name: Upload tested native runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
